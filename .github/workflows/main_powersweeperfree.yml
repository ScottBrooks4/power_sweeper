name: Build and deploy PHP app to Azure Web App - powersweeperfree

# Preferred publish path once AZURE_WEBAPP_PUBLISH_PROFILE is set on this repo.
# Fallback when the secret is missing or Actions cannot reach Azure:
#   bash scripts/publish_azure_release.sh
# then Portal Zip Deploy of the azure-latest asset.

on:
  push:
    branches:
      - main
      - cursor/deploy-latest-150e
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Build artifact only (skip Azure deploy)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: Install production Composer deps
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Package Azure zip
        run: bash scripts/package_azure_zip.sh "$RUNNER_TEMP/power_sweeper-azure.zip"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: ${{ runner.temp }}/power_sweeper-azure.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_deploy != 'true' }}
    permissions:
      contents: read

    steps:
      - name: Require publish profile secret
        env:
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PROFILE" ]; then
            echo "::error::AZURE_WEBAPP_PUBLISH_PROFILE is not set on this repository."
            echo "Add the App Service publish-profile XML as a repo Actions secret,"
            echo "or use the azure-latest GitHub Release zip + Portal Zip Deploy."
            echo "See README → Reliable Azure publish."
            exit 1
          fi

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
          path: ${{ runner.temp }}/artifact

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'powersweeperfree'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/artifact/power_sweeper-azure.zip
