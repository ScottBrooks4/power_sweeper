name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run test suite
        run: php tests/run_tests.php

      - name: Validate powered deliverable
        run: php scripts/validate_powered.php samples/import_debug/CDLS_L_VCR_App_repair2.powered.msapp
