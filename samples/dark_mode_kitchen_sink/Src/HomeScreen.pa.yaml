HomeScreen:
  Control: Screen@2.0.0
  Properties:
    Fill: =RGBA(250, 250, 252, 1)
    LoadingSpinnerColor: =RGBA(37, 99, 235, 1)
  Children:
    - HeroBanner:
        Control: GroupContainer@1.0.0
        Variant: ManualLayout
        Properties:
          Fill: =RGBA(255, 255, 255, 1)
          BorderColor: =RGBA(226, 232, 240, 1)
          BorderThickness: =1
          BorderRadius: =12
          DropShadow: =DropShadow.Semibold
          X: =24
          Y: =24
          Width: =752
          Height: =160
          PaddingTop: =20
          PaddingRight: =20
          PaddingBottom: =20
          PaddingLeft: =20
        Children:
          - HeroTitle:
              Control: Label@2.0.0
              Properties:
                Text: ="Dark Mode Kitchen Sink"
                Color: =RGBA(15, 23, 42, 1)
                Fill: =RGBA(0, 0, 0, 0)
                Font: =Font.'Segoe UI'
                Size: =28
                FontWeight: =FontWeight.Semibold
                X: =16
                Y: =16
                Width: =500
                Height: =40
          - HeroSubtitle:
              Control: Label@2.0.0
              Properties:
                Text: ="Exhaustive light-theme surfaces for Power Sweeper dark-mode testing"
                Color: =RGBA(71, 85, 105, 1)
                Fill: =Color.Transparent
                Size: =13
                X: =16
                Y: =64
                Width: =560
                Height: =40
          - OpenControlsBtn:
              Control: Classic/Button@2.0.0
              Properties:
                Text: ="Open controls gallery"
                Fill: =RGBA(37, 99, 235, 1)
                Color: =RGBA(255, 255, 255, 1)
                BorderColor: =RGBA(29, 78, 216, 1)
                BorderThickness: =1
                HoverFill: =RGBA(29, 78, 216, 1)
                HoverColor: =RGBA(255, 255, 255, 1)
                HoverBorderColor: =RGBA(30, 64, 175, 1)
                PressedFill: =RGBA(30, 64, 175, 1)
                PressedColor: =RGBA(241, 245, 249, 1)
                PressedBorderColor: =RGBA(30, 58, 138, 1)
                DisabledFill: =RGBA(203, 213, 225, 1)
                DisabledColor: =RGBA(100, 116, 139, 1)
                DisabledBorderColor: =RGBA(148, 163, 184, 1)
                FocusedBorderColor: =RGBA(59, 130, 246, 1)
                X: =16
                Y: =108
                Width: =200
                Height: =40
                OnSelect: =Navigate(ControlsScreen, ScreenTransition.Fade)
          - AccentChip:
              Control: Label@2.0.0
              Properties:
                Text: ="Accent chip"
                Align: =Align.Center
                VerticalAlign: =VerticalAlign.Middle
                Color: =RGBA(255, 255, 255, 1)
                Fill: =RGBA(16, 185, 129, 1)
                BorderColor: =RGBA(5, 150, 105, 1)
                BorderThickness: =1
                BorderRadius: =20
                X: =560
                Y: =108
                Width: =120
                Height: =32

    - SurfaceCardLight:
        Control: GroupContainer@1.0.0
        Properties:
          Fill: =Color.White
          BorderColor: =RGBA(226, 232, 240, 1)
          BorderThickness: =1
          BorderRadius: =10
          DropShadow: =DropShadow.Regular
          X: =24
          Y: =208
          Width: =360
          Height: =140
        Children:
          - SurfaceTitle:
              Control: Label@2.0.0
              Properties:
                Text: ="White surface + dark ink"
                Color: =Color.Black
                X: =16
                Y: =16
                Width: =300
                Height: =28
          - SurfaceBody:
              Control: Label@2.0.0
              Properties:
                Text: ="Body copy on near-white gray"
                Color: =RGBA(51, 65, 85, 1)
                Fill: =RGBA(248, 250, 252, 1)
                BorderColor: =RGBA(203, 213, 225, 1)
                BorderThickness: =1
                X: =16
                Y: =56
                Width: =320
                Height: =60

    - SurfaceCardTinted:
        Control: GroupContainer@1.0.0
        Properties:
          Fill: =RGBA(239, 246, 255, 1)
          BorderColor: =RGBA(147, 197, 253, 1)
          BorderThickness: =2
          BorderRadius: =10
          DropShadow: =DropShadow.Light
          X: =416
          Y: =208
          Width: =360
          Height: =140
        Children:
          - TintTitle:
              Control: Label@2.0.0
              Properties:
                Text: ="Tinted panel"
                Color: =RGBA(30, 64, 175, 1)
                X: =16
                Y: =16
                Width: =300
                Height: =28
          - TintBody:
              Control: Label@2.0.0
              Properties:
                Text: ="ColorValue hex fill sample"
                Color: =RGBA(30, 58, 138, 1)
                Fill: =ColorValue("#DBEAFE")
                X: =16
                Y: =56
                Width: =320
                Height: =60

    - WarningBanner:
        Control: GroupContainer@1.0.0
        Properties:
          Fill: =RGBA(254, 243, 199, 1)
          BorderColor: =RGBA(245, 158, 11, 1)
          BorderThickness: =1
          DropShadow: =DropShadow.None
          X: =24
          Y: =368
          Width: =752
          Height: =64
        Children:
          - WarningText:
              Control: Label@2.0.0
              Properties:
                Text: ="Warning / amber surface — should keep a warm accent in dark mode"
                Color: =RGBA(146, 64, 14, 1)
                X: =16
                Y: =16
                Width: =700
                Height: =32

    - FooterBar:
        Control: GroupContainer@1.0.0
        Properties:
          Fill: =RGBA(241, 245, 249, 1)
          BorderColor: =RGBA(203, 213, 225, 1)
          BorderThickness: =1
          DropShadow: =DropShadow.Bold
          X: =24
          Y: =456
          Width: =752
          Height: =56
        Children:
          - FooterLabel:
              Control: Label@2.0.0
              Properties:
                Text: ="Footer / muted bar"
                Color: =RGBA(100, 116, 139, 1)
                X: =16
                Y: =12
                Width: =300
                Height: =32
          - GhostLink:
              Control: Classic/Button@2.0.0
              Properties:
                Text: ="Ghost action"
                Fill: =RGBA(0, 0, 0, 0)
                Color: =RGBA(37, 99, 235, 1)
                BorderColor: =RGBA(37, 99, 235, 1)
                BorderThickness: =1
                HoverFill: =RGBA(239, 246, 255, 1)
                HoverColor: =RGBA(29, 78, 216, 1)
                PressedFill: =RGBA(219, 234, 254, 1)
                PressedColor: =RGBA(30, 64, 175, 1)
                X: =560
                Y: =8
                Width: =160
                Height: =40
