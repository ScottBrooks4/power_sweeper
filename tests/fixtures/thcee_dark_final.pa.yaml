# ************************************************************************************************
App:
  Control: App@1.0.0
  Properties:
    OnStart: =Set(gblReady, true)
Screen1:
  Control: Screen@2.0.0
  Properties:
    Fill: =RGBA(255, 255, 255, 1)
  Children:
    - StatusChip:
        Control: GroupContainer@1.5.0
        Properties:
          BorderColor: =RGBA(250, 204, 21, 1)
          Fill: =ColorFade(Self.BorderColor, 80%)
          Width: =160
          Height: =36
        Children:
          - StatusLabel:
              Control: Label@2.5.1
              Properties:
                Text: ="Draft"
                Color: =RGBA(0, 0, 0, 1)
                Fill: =RGBA(0, 0, 0, 0)
                Width: =160
                Height: =36
    - HeaderHtml:
        Control: HtmlViewer@2.1.0
        Properties:
          Fill: =RGBA(255, 255, 255, 1)
          HtmlText: ="<body style='margin:0; background:#f7f6f3; color:#1f1d1a;'><div class='tdr-section-header__title' style='color:#1f1d1a;'>General Details</div><div style='color:#6b6760;'>Step 1 of 4</div></body>"
    - DetailsHtmlBound:
        Control: HtmlViewer@2.1.0
        Properties:
          Fill: =RGBA(255, 255, 255, 1)
          HtmlText: =comTranslations.Labels.THCEEDetails.Details_GeneralHtml
    - AdminChangesHtml:
        Control: HtmlViewer@2.1.0
        Properties:
          HtmlText: |-
            =comTranslations.Labels.THCEEAdminScreen.Admin_ChangesHTML

            //"<div style='background-color: #fff3cd;'>commented</div>"
    - ReturnHome:
        Control: ModernButton@1.0.0
        Properties:
          BasePaletteColor: =RGBA(189, 178, 176, 1)
          Text: ="Return Home"
    - SendFeedback:
        Control: ModernButton@1.0.0
        Properties:
          BasePaletteColor: =RGBA(156, 220, 79, 1)
          Text: ="Send Feedback"
    - HomepageCard:
        Control: GroupContainer@1.5.0
        Properties:
          Fill: =RGBA(255, 255, 255, 1)
          Width: =200
          Height: =160
        Children:
          - CardIcon:
              Control: Image@2.2.3
              Properties:
                Image: ="data:image/svg+xml;utf8, "& EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 20 20' fill='#333333'><path d='M4 4h12v12H4z'/></svg>")
                Width: =40
                Height: =40
          - Homepage_Start:
              Control: Button@0.0.45
              Properties:
                Appearance: ='ButtonCanvas.Appearance'.Transparent
                BasePaletteColor: =RGBA(189, 178, 176, 1)
                Text: ="Start"
                Width: =120
                Height: =40
    - SidebarSlot:
        Control: GroupContainer@1.5.0
        Properties:
          Fill: =RGBA(255, 255, 255, 1)
          Width: =75
          Height: =50
        Children:
          - NavIcon:
              Control: Classic/Icon@2.5.0
              Properties:
                Color: =RGBA(51, 51, 51, 1)
                Icon: =Icon.Home
                Width: =25
                Height: =25
          - NavHitTarget:
              Control: Button@0.0.45
              Properties:
                Appearance: ='ButtonCanvas.Appearance'.Transparent
                Text: =
                Width: =25
                Height: =25
                X: =0
                Y: =0
    - RemarksHost:
        Control: GroupContainer@1.5.0
        Properties:
          Fill: =RGBA(255, 255, 255, 1)
          Width: =480
          Height: =220
        Children:
          - Remarks:
              Control: RichTextEditor@2.7.0
              Properties:
                StyleName: =defaultRichTextStyle
                BorderColor: =DefaultBorderColor
                Width: =460
                Height: =180
    - ObjectiveBox:
        Control: Classic/TextInput@2.3.2
        Properties:
          Color: =RGBA(51, 51, 51, 1)
          Default: =""
          Width: =400
          Height: =80
    - LoadingScreen_LoadingTitle:
        Control: Label@2.5.1
        Properties:
          Text: ="Loading"
          Fill: =Color.White
          Color: =RGBA(31, 29, 26, 1)
          Width: =200
          Height: =40
    - Text1_5:
        Control: Label@2.5.1
        Properties:
          Text: ="Caption"
          Width: =200
          Height: =32
    - Container28:
        Control: GroupContainer@1.5.0
        Properties:
          Fill: =RGBA(255, 255, 255, 1)
          Width: =640
          Height: =400
        Children:
          - BgPhoto:
              Control: Image@2.2.3
              Properties:
                Image: =SampleImage
                Width: =640
                Height: =400
    - WarningScreen_Icon:
        Control: ModernIcon@0.0.8
        Properties:
          Icon: =Icon.Warning
          Color: =RGBA(51, 51, 51, 1)
          Width: =32
          Height: =32
    - Details_AttendeesBtn:
        Control: Button@0.0.45
        Properties:
          Appearance: ='ButtonCanvas.Appearance'.Transparent
          Text: ="Attendees"
          Size: =10.5
          Width: =140
          Height: =40
    - CardSurface:
        Control: GroupContainer@1.5.0
        Properties:
          Fill: =RGBA(255, 255, 255, 1)
          BorderThickness: =1
          BorderColor: =RGBA(226, 232, 240, 1)
          DropShadow: =DropShadow.Light
          Width: =200
          Height: =80
    - HeaderInfoChip:
        Control: GroupContainer@1.5.0
        Properties:
          Fill: =RGBA(255, 255, 255, 1)
          BorderThickness: =1
          BorderColor: =RGBA(237, 237, 237, 1)
          DropShadow: =DropShadow.None
          Width: =150
          Height: =48
    - StepDot:
        Control: GroupContainer@1.5.0
        Properties:
          Fill: |-
            =If(
                App.ActiveScreen='THCEE Attendees',
                RGBA(106,122,127,1),
                RGBA(255,255,255,1)
            )
          DropShadow: =DropShadow.None
          Width: =24
          Height: =24
    - LoadingTitleModern:
        Control: Text@0.0.51
        Properties:
          Text: ="The app is currently loading..."
          FontColor: =RGBA(79, 90, 94, 1)
          Width: =400
          Height: =40
    - SidebarRail:
        Control: GroupContainer@1.5.0
        Properties:
          Fill: =DefaultGrayBackgroud
          Width: =80
          Height: =768
    - Approvals_ExecutiveSummary:
        Control: Classic/Button@2.2.0
        Properties:
          Color: |-
            =If(
                varTransmitalContainer = "2",
                Self.HoverColor,
                RGBA(51,51,51,1)
            )
          Fill: |-
            =If(
                varTransmitalContainer = "2",
                Self.HoverFill,
                RGBA(0,0,0,0)
            )
          HoverColor: =RGBA(255, 255, 255, 1)
          HoverFill: =RGBA(110, 110, 110, 1)
          Text: ="Executive Summary"
          Width: =160
          Height: =36
    - ApprovalsStep:
        Control: GroupContainer@1.5.0
        Properties:
          Fill: |-
            =If(
                App.ActiveScreen = 'THCEE Approvals',
                RGBA(79, 90, 94, 1),
                RGBA(227, 227, 227, 1)
            )
          Width: =145
          Height: =30
ComponentDefinitions:
  TranslationHost:
    DefinitionType: CanvasComponent
    AccessAppScope: false
    CustomProperties: {}
    Properties:
      Height: =40
      Width: =200
      OnReset: |-
        =Set(
            varTranslations,
            Table(
                {
                    Language: "en-ca",
                    Labels: {
                        THCEEApprovals: {
                            Approvals_HTML: "<!doctype html><body style='margin:0; background:#FFFFFF; color:#0F172A;'><div class='tdr-section-card' style='background:#ffffff;'><div class='tdr-section-header__title' style='color:#0F172A;'>Transmittal List</div><div class='tdr-section-header__subtitle' style='color:#6b6760;'>Step 4 of 4</div></div></body>"
                        }
                    }
                }
            )
        )
