App:
  Control: App@1.0.0
  Properties:
    Formulas: "=DefaultGrayBackgroud = RGBA(250, 250, 250, 1);"
    OnStart: =Set(gblReady, true)
Screen1:
  Control: Screen@2.0.0
  Properties:
    Fill: =RGBA(255, 255, 255, 1)
  Children:
    - SettingsMiddle:
        Control: GroupContainer@1.5.0
        Properties:
          Fill: =RGBA(255, 255, 255, 1)
          BorderColor: =RGBA(200, 200, 200, 1)
          X: =0
          Y: =0
          Width: =600
          Height: =400
          LayoutMaxHeight: =
          LayoutMaxWidth: =
        Children:
          - ThemeHeader:
              Control: Label@2.5.1
              Properties:
                Text: ="Theme"
                Color: =RGBA(51, 51, 51, 1)
                X: =25
                Y: =20
                Width: =200
                Height: =35
          - ThemeRadio:
              Control: Radio@0.0.25
              Properties:
                DefaultSelectedItems: |
                  =["Light"]
                Items: =["Light"]
                Layout: ='RadioGroupCanvas.Layout'.Horizontal
                X: =25
                Y: =60
                Width: =300
                Height: =40
          - Title:
              Control: Label@2.0.0
              Properties:
                Text: ="Welcome"
                Color: =RGBA(20, 20, 20, 1)
                Fill: =RGBA(0, 0, 0, 0)
                X: =25
                Y: =120
                Width: =200
                Height: =40
