Screen1:
  Control: Screen@2.0.0
  Properties:
    Fill: =RGBA(255; 255; 255; 1)
    OnVisible: |-
      =Set(x; 12,5);; Notify("Hallo"; NotificationType.Information)
  Children:
    - TitleLabel:
        Control: Label@2.0.0
        Properties:
          Text: |-
            ="Preis: " & Text(1999,95; "0,00")
          Color: =RGBA(0; 0; 0; 1)
          X: =20
          Y: =20
          Width: =300
          Height: =40
    - HiddenCalc:
        Control: Label@2.0.0
        Properties:
          Text: =If(Value(TextInput1.Text) > 10,5; "ok"; "no")
          Visible: =false
          X: =20
          Y: =80
