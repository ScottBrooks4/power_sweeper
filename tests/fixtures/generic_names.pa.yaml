Screen1:
  Control: Screen@2.0.0
  Properties:
    Fill: =RGBA(255, 255, 255, 1)
  Children:
    - Container1:
        Control: GroupContainer@1.0.0
        Variant: AutoLayout
        Properties:
          Fill: =RGBA(255, 255, 255, 1)
          Width: =400
          Height: =300
        Children:
          - Label1:
              Control: Label@2.0.0
              Properties:
                Text: ="Customer Details"
                Width: =200
                Height: =40
          - Button1:
              Control: Classic/Button@2.0.0
              Properties:
                Text: ="Submit Request"
                OnSelect: =Set(gblLastClicked, Button1.Text); Notify("Done", NotificationType.Success)
                Width: =160
                Height: =40
