# Accessibility tab-stop / label / focus situations Studio App checker flags.
App:
  Control: App@1.0.0
  Properties:
    OnStart: =Set(gblReady, true)
Screen1:
  Control: Screen@2.0.0
  Properties:
    Fill: =RGBA(255, 255, 255, 1)
  Children:
    - StaticCaption:
        Control: Label@2.5.1
        Properties:
          Text: ="Static caption — should stay without TabIndex"
          X: =20
          Y: =10
          Width: =300
          Height: =30
    - Label3_2:
        Control: Label@2.5.1
        Properties:
          Text: ="Help guide"
          TabIndex: =-1
          OnSelect: =false
          X: =20
          Y: =50
          Width: =120
          Height: =30
    - tileTitle:
        Control: Label@2.5.1
        Properties:
          Text: ="Quarterly Bulk"
          TabIndex: =-1
          X: =20
          Y: =90
          Width: =200
          Height: =30
    - ClickableLabel:
        Control: Label@2.5.1
        Properties:
          Text: ="Open details"
          OnSelect: =Navigate(Screen2)
          X: =20
          Y: =130
          Width: =160
          Height: =30
    - Icon1_1:
        Control: Classic/Icon@2.5.0
        Properties:
          Icon: =Icon.Home
          TabIndex: =-1
          OnSelect: =Navigate(Screen2)
          X: =20
          Y: =170
          Width: =32
          Height: =32
    - Rectangle9_1:
        Control: Rectangle@2.3.0
        Properties:
          Fill: =RGBA(200, 200, 200, 1)
          TabIndex: =-1
          OnSelect: =Navigate(Screen2)
          X: =60
          Y: =170
          Width: =80
          Height: =32
    - TemplateSVGImg:
        Control: Image@2.2.3
        Properties:
          Image: ="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>"
          TabIndex: =-1
          OnSelect: =false
          X: =160
          Y: =170
          Width: =40
          Height: =40
    - OverViewGallery:
        Control: Gallery@2.15.0
        Properties:
          Items: =[1, 2, 3]
          TabIndex: =-1
          X: =20
          Y: =220
          Width: =300
          Height: =100
    - conHeaderHeader_UserProfile_2:
        Control: GroupContainer@1.5.0
        Properties:
          TabIndex: =-1
          X: =20
          Y: =340
          Width: =200
          Height: =40
        Children:
          - ProfileLabel:
              Control: Label@2.5.1
              Properties:
                Text: ="Profile"
                TabIndex: =-1
                X: =0
                Y: =0
                Width: =100
                Height: =30
    - SaveButton:
        Control: Classic/Button@2.2.0
        Properties:
          Text: ="Save"
          X: =20
          Y: =400
          Width: =100
          Height: =40
Screen2:
  Control: Screen@2.0.0
  Properties:
    Fill: =RGBA(255, 255, 255, 1)
