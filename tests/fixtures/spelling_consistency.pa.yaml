Screen1:
  Control: Screen@2.0.0
  Properties:
    Fill: =RGBA(255, 255, 255, 1)
  Children:
    - ColourLabel:
        Control: Label@2.0.0
        Properties:
          Text: ="Pick a color for your favourite honour"
          HintText: ="Organize the colors"
          Tooltip: ="Centered grey dialog"
          AccessibleLabel: ="color picker"
          X: =20
          Y: =20
          Width: =300
          Height: =40
    - NavigateBtn:
        Control: Classic/Button@2.0.0
        Properties:
          Text: ="Go"
          OnSelect: =Navigate('Colour Screen'); Notify("honour the color")
          X: =20
          Y: =80
          Width: =120
          Height: =40
