App:
  Control: App@1.0.0
  Properties:
    OnStart: =Set(gblReady, true)
Screen1:
  Control: Screen@2.0.0
  Properties:
    Fill: =RGBA(255, 255, 255, 1)
  Children:
    - Header:
        Control: GroupContainer@1.0.0
        Properties:
          Fill: =RGBA(245, 245, 245, 1)
          BorderColor: =RGBA(200, 200, 200, 1)
          X: =0
          Y: =0
          Width: =600
          Height: =80
        Children:
          - Title:
              Control: Label@2.0.0
              Properties:
                Text: ="Welcome"
                Color: =RGBA(20, 20, 20, 1)
                Fill: =RGBA(0, 0, 0, 0)
                X: =20
                Y: =20
                Width: =200
                Height: =40
          - Accent:
              Control: Classic/Button@2.0.0
              Properties:
                Text: ="Go"
                Fill: =RGBA(37, 99, 235, 1)
                Color: =RGBA(255, 255, 255, 1)
                X: =240
                Y: =20
                Width: =100
                Height: =40
