# Reference nginx overlay for Power Sweeper on Azure App Service (Linux PHP).
#
# Do NOT install this file wholesale over the platform default — that caused
# site-wide 404s. azure/startup.sh only raises client_max_body_size in-place.
#
# Kept here for documentation / local Docker experiments.

server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    index index.php;
    server_name _;
    client_max_body_size 512M;

    location ^~ /assets/ {
        alias /home/site/wwwroot/public/assets/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ ^/api/.+\.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 1800;
        fastcgi_send_timeout 1800;
        fastcgi_buffering off;
        fastcgi_request_buffering off;
        client_max_body_size 512M;
    }

    location ^~ /api/ {
        return 404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 1800;
        fastcgi_send_timeout 1800;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/(storage|vendor|src|profiles|config|tests|samples|scripts)/ {
        deny all;
    }
}
