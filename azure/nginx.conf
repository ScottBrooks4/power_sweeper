# Azure App Service (Linux) nginx site overlay for Power Sweeper.
# Deployed by azure/startup.sh to /etc/nginx/sites-available/default (or home override).
#
# Document root is the repo root (not public/) so /api/*.php and index.php resolve.

server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    index index.php;
    server_name _;
    client_max_body_size 256M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /assets/ {
        alias /home/site/wwwroot/public/assets/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ ^/api/.+\.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
        client_max_body_size 256M;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/(storage|vendor|src|profiles|config|tests|samples|scripts)/ {
        deny all;
    }
}
