# Known-good nginx site config for Azure App Service Linux PHP 8.x.
# Based on the blessed-image default (sites-enabled/default), with:
# - client_max_body_size 512M (fixes HTTP 413 on .msapp uploads)
# - /assets/ aliased to public/assets/
# - standard PHP FastCGI handling
#
# azure/startup.sh installs this to /home/site/default and
# /etc/nginx/sites-enabled/default on every boot.

server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    index index.php index.html index.htm hostingstart.html;
    server_name _;
    port_in_redirect off;
    client_max_body_size 512M;

    location ^~ /assets/ {
        alias /home/site/wwwroot/public/assets/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        index index.php index.html index.htm hostingstart.html;
        try_files $uri $uri/ /index.php?$args;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /html/;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(storage|vendor|src|profiles|config|tests|samples|scripts)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_intercept_errors on;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 1800;
        fastcgi_read_timeout 1800;
        fastcgi_buffering off;
        client_max_body_size 512M;
    }
}
