<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Power Sweeper">
  <rect width="64" height="64" rx="14" fill="#1a1400"/>

  <!-- action lines -->
  <g fill="none" stroke="#F5D547" stroke-linecap="round">
    <path d="M3 12h14" stroke-width="2.35" opacity=".95"/>
    <path d="M2 19h17" stroke-width="2.35" opacity=".8"/>
    <path d="M4 26h15" stroke-width="2.2" opacity=".62"/>
    <path d="M7 33h12" stroke-width="2" opacity=".45"/>
  </g>

  <!-- single solid stick -->
  <line x1="53.5" y1="4" x2="38" y2="22.5" stroke="#FFD84D" stroke-width="3.4" stroke-linecap="round"/>

  <!-- rope binding (reads as wraps, not extra sticks) -->
  <ellipse cx="35.6" cy="25.2" rx="6.2" ry="3.6" transform="rotate(-48 35.6 25.2)" fill="#F7E27A" stroke="#8F7318" stroke-width="1"/>
  <path d="M31.2 22.6 C33.6 25.4 36.4 27.6 39.8 28.8" fill="none" stroke="#C9A227" stroke-width="1.15" stroke-linecap="round"/>
  <path d="M30.6 24.4 C33.2 27.2 36.2 29.2 39.6 30.2" fill="none" stroke="#A8861A" stroke-width="1.15" stroke-linecap="round"/>
  <path d="M30.2 26.2 C32.8 28.8 35.8 30.6 39.2 31.4" fill="none" stroke="#C9A227" stroke-width="1.15" stroke-linecap="round"/>

  <!-- straw head: narrow at binding, wide at tips -->
  <path fill="#E8B923" d="
    M31 27.5
    C36.5 30.5 41 37 43.5 46
    C44.5 50 44.2 54.5 42.5 58.5
    C36.5 61.5 28.5 62 20.5 59.5
    C13.5 57.2 8.5 52.5 6.5 47.5
    C9.5 39.5 15.5 32 23 28.5
    C25.5 27.5 28.2 27.2 31 27.5
    Z"/>
  <path fill="#FFD84D" d="
    M31.2 28.8
    C36 31.5 39.8 37.5 42 45.5
    C42.8 49 42.6 53 41.2 56.5
    C36 59 29 59.5 22 57.5
    C15.5 55.5 11 51.5 9.2 47
    C11.8 40 17 33.5 23.8 30.2
    C26.2 29.2 28.8 28.8 31.2 28.8
    Z"/>

  <!-- straw grain — many thin bristles -->
  <g fill="none" stroke-linecap="round" stroke="#A8861A">
    <path d="M33.5 30.5 C38 38 41 48 41.5 57" stroke-width="1.15"/>
    <path d="M31.2 31 C35 39 37.2 49 37 58" stroke-width="1.1"/>
    <path d="M29 31.6 C32 40 33.2 50 32.2 58.2" stroke-width="1.15"/>
    <path d="M26.8 32.4 C29 41 29.2 51 27.4 58.4" stroke-width="1.1"/>
    <path d="M24.6 33.4 C25.8 42 25 52 22.4 58" stroke-width="1.15"/>
    <path d="M22.4 34.8 C22.6 43 20.8 52 17.6 57" stroke-width="1.1"/>
    <path d="M20.2 36.4 C19.4 44 16.8 52 13.4 56" stroke-width="1.1"/>
    <path d="M18.2 38.2 C16.4 45.5 13.2 52.5 10 55.5" stroke-width="1.05"/>
    <path d="M35.6 30 C40.5 38.5 43.5 49 43.5 57" stroke-width="1" opacity=".75"/>
  </g>

  <!-- soft tip ends -->
  <g fill="none" stroke="#C9A227" stroke-linecap="round" stroke-width="1.5">
    <path d="M41.8 55.5 L43.8 61"/>
    <path d="M38 56.8 L39.2 62"/>
    <path d="M33.8 57.6 L34.2 62.4"/>
    <path d="M29.4 58 L29 62.6"/>
    <path d="M25 57.4 L23.8 61.8"/>
    <path d="M20.8 56 L19 60.2"/>
    <path d="M16.8 54 L14.6 58"/>
    <path d="M13.2 51.5 L10.8 55.2"/>
    <path d="M10.4 48.5 L8 51.8"/>
  </g>

  <!-- powerful determined eye -->
  <circle cx="25.8" cy="42.5" r="5.6" fill="#FFF8E0" stroke="#1a1400" stroke-width="1.2"/>
  <circle cx="24.7" cy="42.9" r="2.7" fill="#1a1400"/>
  <circle cx="23.85" cy="41.95" r="1" fill="#FFF8E0"/>
  <path d="M19.6 37.4 C23 34.8 27.2 34.6 31.4 37.6" fill="none" stroke="#1a1400" stroke-width="2.4" stroke-linecap="round"/>
</svg>
