; Raised for large canvas .msapp uploads (php-fpm / CGI pick this up per-directory).
; Restart php-fpm or wait for user_ini.cache_ttl if limits do not apply immediately.
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
max_execution_time = 600
max_input_time = 600
memory_limit = 512M
