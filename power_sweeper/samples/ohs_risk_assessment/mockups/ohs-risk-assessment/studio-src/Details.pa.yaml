                                ="<!doctype html>
                                <html lang='en'>
                                <head>
                                <meta charset='utf-8'/>
                                <title>TDR — Section Header</title>
                                </head>
                                <body style='margin: 0; background: #f7f6f3; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif; color: #1f1d1a; -webkit-font-smoothing: antialiased; padding: 24px;'>

                                <div class='tdr-section-card' style='background: #ffffff; border-radius: 10px; overflow: hidden; box-sizing: border-box;'>
                                  <div class='tdr-section-header' style='display: flex; align-items: center; gap: 12px; padding: 15px 28px; box-sizing: border-box;'>
                                    <div class='tdr-section-header__num' style='width: 28px; height: 28px; border-radius: 8px; background: #2a2723; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex: none; box-sizing: border-box;'>1</div>
                                    <div class='tdr-section-header__body' style='flex: 1; min-width: 0; box-sizing: border-box;'>
                                      <div class='tdr-section-header__title' style='font-size: 16px; font-weight: 600; letter-spacing: -0.005em; color: #1f1d1a; box-sizing: border-box;'>General Details</div>
                                      <div class='tdr-section-header__subtitle' style='font-size: 12px; color: #6b6760; margin-top: 2px; box-sizing: border-box;'>Lorem Ipsum.</div>
                                    </div>
                                    <div class='tdr-section-header__step' style='font-size: 11px; color: #6b6760; font-weight: 500; flex: none; box-sizing: border-box;'>Step 1 of 4</div>
                                  </div>
                                  <!-- form fields go here -->
                                </div>

                                </body>
                                </html>"
