Screens:
  Control Screen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - comExternalFunctions:
          Control: CanvasComponent
          ComponentName: ExternalFunctions
          Properties:
            Fill: =RGBA(224, 86, 6, 1)
            Height: =100
            Width: =100
            X: =16
            Y: =16
      - comTranslations:
          Control: CanvasComponent
          ComponentName: TranslationComponent
          Properties:
            Fill: =RGBA(52, 152, 47, 1)
            Height: =100
            Language: =If(varLang, "en-ca", "fr-ca")
            Width: =100
            X: =16
            Y: =127
