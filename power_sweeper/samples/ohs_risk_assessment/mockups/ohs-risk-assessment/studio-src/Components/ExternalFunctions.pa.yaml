      MoveTemplateItemOrder: |-
        =If(
            inputNewOrder <> inputCurrentOrder,
            With(
                {
                    ApprovalItems: THCEE_colEditTemplate
                },
                With(
                    {
                        RowstoUpdateLower: Filter(
                            ApprovalItems,
                            Order > inputCurrentOrder And Order <= inputNewOrder
                        ),
                        RowstoUpdateHigher: Filter(
                            ApprovalItems,
                            Order >= inputNewOrder And Order < inputCurrentOrder
                        )
                    },
                    If(
                        inputNewOrder > inputCurrentOrder,
                        ForAll(
                            RowstoUpdateLower,
                            Patch(
                                THCEE_colEditTemplate,
                                {ID: ThisRecord.ID},
                                {
                                    Order: ThisRecord.Order - 1
                                }
                            )
                        );
                        If(
                            !IsBlank(inputItemID),
                            Patch(
                                THCEE_colEditTemplate,
                                {ID: inputItemID},
                                {
                                    Order: inputNewOrder
                                }
                            )
                        )
                    );
                    If(
                        inputNewOrder < inputCurrentOrder,
                        ForAll(
                            RowstoUpdateHigher,
                            Patch(
                                THCEE_colEditTemplate,
                                {ID: ThisRecord.ID},
                                {
                                    Order: ThisRecord.Order + 1
                                }
                            )
                        );
                        If(
                            !IsBlank(inputItemID),
                            Patch(
                                THCEE_colEditTemplate,
                                {ID: inputItemID},
                                {
                                    Order: inputNewOrder
                                }
                            )
                        )
                    );
                );
            )
        )
