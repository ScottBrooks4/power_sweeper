ComponentDefinitions:
  TranslationComponent:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      GetInfoData:
        PropertyKind: Action
        DisplayName: GetInfoData
        Description: A custom property
        ReturnType: None
        Parameters:
          - ScreenID:
              Description: A parameter
              DataType: Number
              Default: =100
          - ItemID:
              Description: A parameter
              DataType: Number
              Default: =100
      Labels:
        PropertyKind: Output
        DisplayName: Labels
        Description: Translated Labels for TDR Homepage
        DataType: Record
      Language:
        PropertyKind: Input
        DisplayName: Language
        Description: Language Control
        RaiseOnReset: true
        DataType: Text
        Default: =If(varLang, "en-ca", "fr-ca")
