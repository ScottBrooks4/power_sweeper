                  - Label3_3:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(51, 51, 51, 1)
                        Font: =Font.'Open Sans'
                        Height: =Parent.Height
                        Size: =11
                        Text: ="Refresh Data Sources"
                        Width: =Parent.Width
                  - Button1_3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Open Sans'
                        Height: =Parent.Height
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        OnSelect: |-
                          =With(
                              {ImportedData: 'VCDSTDR—ImportDataFlow'.Run()},
                              IfError(
                                  ImportedData,
                                  Notify(
                                      "ERROR: There was an error refreshing the datasources...",
                                      NotificationType.Error,
                                      4000
                                  ),
                                  ClearCollect(
                                      colLocations,
                                      ForAll(
                                          Table(ParseJSON(ImportedData.locations).value),
                                          {
                                              ID: Trim(Text(Value.ID)),
                                              City_EN: Trim(
                                                  Text(
                                                      First(
                                                          Split(
                                                              Value.field_4,
                                                              "/"
                                                          )
                                                      ).Value
                                                  )
                                              ),
                                              City_FR: Trim(
                                                  Text(
                                                      Last(
                                                          Split(
                                                              Value.field_4,
                                                              "/"
                                                          )
                                                      ).Value
                                                  )
                                              ),
                                              ProvinceState: Trim(Text(Value.field_2)),
                                              Country_EN: Trim(
                                                  Text(
                                                      First(
                                                          Split(
                                                              Value.field_5,
                                                              "/"
                                                          )
                                                      ).Value
                                                  )
                                              ),
                                              Country_FR: Trim(
                                                  Text(
                                                      Last(
                                                          Split(
                                                              Value.field_5,
                                                              "/"
                                                          )
                                                      ).Value
                                                  )
                                              )
                                          }
                                      )
                                  );
                                  ClearCollect(
                                      colMealCosts,
                                      ForAll(
                                          Table(ParseJSON(ImportedData.mealcosts).value),
                                          {
                                              ID: Trim(Text(Value.ID)),
                                              Country: Trim(Text(Value.field_1)),
                                              City: Trim(Text(Value.field_2)),
                                              RateType: First(
                                                  Split(
                                                      Trim(Text(Value.field_3)),
                                                      "-"
                                                  )
                                              ).Value,
                                              RateCode: Switch(
                                                  Trim(
                                                      Last(
                                                          Split(
                                                              Trim(Text(Value.field_3)),
                                                              "Day"
                                                          )
                                                      ).Value
                                                  ),
                                                  "1-30",
                                                  0,
                                                  "31-120",
                                                  1,
                                                  2
                                              ),
                                              Breakfast: Trim(Text(Value.field_4)),
                                              Lunch: Trim(Text(Value.field_5)),
                                              Dinner: Trim(Text(Value.field_6)),
                                              Incidental: Trim(Text(Value.field_8)),
                                              Date: Trim(Text(Value.field_10)),
                                              Currency: Trim(Text(Value.field_12))
                                          }
                                      )
                                  );
                                  ClearCollect(
                                      colExchangeRates,
                                      ForAll(
                                          Table(ParseJSON(ImportedData.exchangerates).value),
                                          {
                                              ID: Trim(Text(Value.ID)),
                                              Date: Trim(Text(Value.field_0)),
                                              CurrencyNameEN: Trim(Text(Value.field_2)),
                                              CurrencyNameFR: Trim(Text(Value.field_3)),
                                              Rate: Trim(Text(Value.field_4)),
                                              Currency: Trim(Text(Value.Title))
                                          }
                                      )
                                  );
                                  ClearCollect(
                                      colOrganizationHierarchy,
                                      ForAll(
                                          Table(ParseJSON(ImportedData.org).value),
                                          {
                                              ID: Trim(Text(Value.ID)),
                                              EnglishNameShort: Trim(Text(Value.EnglishName_x0028_Long_x0029_)),
                                              EnglishNameLong: Trim(Text(Value.EnglishName)),
                                              FrenchNameShort: Trim(Text(Value.FrenchName)),
                                              Level: Trim(Text(Value.Level)),
                                              ParentID: Trim(Value(Value.ParentOrgId))
                                          }
                                      )
                                  );
                                  Notify(
                                      "Data sources refreshed.",
                                      NotificationType.Success,
                                      2000
                                  )
                              )
                          )
                        PressedBorderColor: =Self.Fill
