                      StartsWith('VCDS Group', "OUTCAN URS"), "OUTCAN URS/DFL",
                      StartsWith('VCDS Group', "CFSG"), "CFSG (O-G)",
                      StartsWith('VCDS Group', "DGDS"), "DGDS",
                      StartsWith('VCDS Group', "C Prog"), "C Prog",
