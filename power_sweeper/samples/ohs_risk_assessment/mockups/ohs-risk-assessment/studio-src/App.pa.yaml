App:
  Properties:
    Formulas: |-
      =varEnv = "dev";   // "dev" or "prod"
      fnIsDev = varEnv = "dev";
      fnIsProd = varEnv = "prod";

      LinkToApp =
          If(
              fnIsDev,
              "https://apps.powerapps.com/play/e/9ed70000-7006-e3b7-a4b4-c31cb53e5df0/a/dd692a7a-782a-4903-a837-64f19b2913db?tenantId=325b4494-1587-40d5-bb31-8b660b7f1038&hint=ff71f6ed-120c-43b2-a51f-16f21de021d4",
              "<PROD play URL>"
          );

      gblThemeLight = { /* full record from VCR — Accent, Page, Surface, Text, … */ };
      gblThemeDark  = { /* full dark record from VCR */ };

      // Colors
      DefaultGrayBackgroud = RGBA(
          250,
          250,
          250,
          1
      );

      // Navigating Menu
      SideMenuFirstTable = [
          {
              Screen: Homepage,
              Name: "Home",
              Icon: Icon.Home
          },
          //{
          //    Screen: 'THCEE New Package',
          //    Name: "New EHCR",
          //    Icon: Icon.Add
          //},
          {
              Screen: Dashboard,
              Name: "Dashboard",
              Icon: Icon.Items
          }
      ];
      SideMenuSecondTable = [
          {
              Screen: Details,
              Name: "Details",
              Icon: Icon.LevelsLayersItems
          },
          {
              Screen: Approvals,
              Name: "Approvals",
              Icon: Icon.LogJournal
          },
          {
              Screen: Chat,
              Name: "Chat",
              Icon: Icon.Message
          }
      ];
      SideMenuThirdTable = [
          {
              Screen: 'Admin Screen',
              Name: "Users & Templates",
              Icon: Icon.Printing3D
          },
          {
              Screen: Homepage,
              Name: "Metrics",
              Icon: Icon.TrendingUpwards
          }
      ];



      fxRiskFill(Score: Number): Color =
          If(
              Score <= 3, gblColorRiskLow,
              Score <= 6, gblColorRiskModerate,
              Score <= 12, gblColorRiskHigh,
              gblColorRiskExtreme
          );

      fxRiskBand(Score: Number): Text =
          If(
              Score <= 3, "Low",
              Score <= 6, "Moderate",
              Score <= 12, "High",
              "Extreme"
          );
    OnStart: |-
      =// Use this property to set the app parameters using Param() and to set the app verision value
      Set(AppVersion,"0.0.0");
      Set(varSideMenu, false); // sidemenu closed OnStart
      Set(varL2, "All");
      Set(varProgram, "All");
      Set(varHighOnly, false);

