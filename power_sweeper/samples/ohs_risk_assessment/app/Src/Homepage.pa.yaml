Screens:
  Homepage:
    Properties:
      Fill: =gblTheme.Page
      LoadingSpinnerColor: =gblTheme.Accent
    Children:
      - imgMockupInbox:
          Control: Image@2.2.3
          Properties:
            DisplayMode: =DisplayMode.View
            Height: =App.Height
            Image: =MockupInbox
            ImagePosition: =ImagePosition.Fit
            Width: =App.Width
            X: =0
            Y: =0
            ZIndex: =1
      - SidebarMenu_Home:
          Control: CanvasComponent
          ComponentName: SidebarMenu
          Properties:
            Height: =App.Height
            Visible: =true
            Width: =gblNavWidth
            X: =0
            Y: =0
            ZIndex: =90
      - galInboxFilters:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =36
            Items: =colInboxFilters
            Layout: =Layout.Horizontal
            TemplatePadding: =0
            TemplateSize: =124
            Width: =App.Width - gblNavWidth - 44
            X: =gblNavWidth + 22
            Y: =168
            ZIndex: =50
          Children:
            - btnInboxFilter:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =If(ThisItem.Selected, gblTheme.ChipOn, gblTheme.Border)
                  BorderThickness: =1
                  Color: =If(ThisItem.Selected, gblTheme.ChipOnInk, gblTheme.Text)
                  Fill: =If(ThisItem.Selected, gblTheme.ChipOn, gblTheme.Chip)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  HoverFill: =If(ThisItem.Selected, ColorFade(gblTheme.ChipOn, 10%), ColorFade(gblTheme.Chip, -6%))
                  OnSelect: |-
                    =UpdateIf(colInboxFilters, true, {Selected: false});
                    Patch(colInboxFilters, ThisItem, {Selected: true})
                  RadiusBottomLeft: =gblRadiusPill
                  RadiusBottomRight: =gblRadiusPill
                  RadiusTopLeft: =gblRadiusPill
                  RadiusTopRight: =gblRadiusPill
                  Size: =10
                  Text: =ThisItem.Value
                  Width: =Parent.TemplateWidth - 8
                  X: =0
                  Y: =4
      - btnNotifyOPIs:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =gblTheme.Border
            Color: =gblTheme.Text
            Fill: =gblTheme.Quiet
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =36
            HoverFill: =ColorFade(gblTheme.Quiet, -10%)
            OnSelect: =Notify("OPIs notified for this cycle.", NotificationType.Success)
            RadiusBottomLeft: =gblRadius
            RadiusBottomRight: =gblRadius
            RadiusTopLeft: =gblRadius
            RadiusTopRight: =gblRadius
            Size: =12
            Text: ="Notify OPIs"
            Width: =120
            X: =App.Width - 300
            Y: =22
            ZIndex: =60
      - btnInboxReview:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =gblTheme.Border
            Color: =gblTheme.TextOnAccent
            Fill: =gblTheme.Accent
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =36
            HoverFill: =ColorFade(gblTheme.Accent, -10%)
            OnSelect: =Navigate(Details, ScreenTransition.Fade)
            RadiusBottomLeft: =gblRadius
            RadiusBottomRight: =gblRadius
            RadiusTopLeft: =gblRadius
            RadiusTopRight: =gblRadius
            Size: =12
            Text: ="Open review"
            Width: =140
            X: =App.Width - 168
            Y: =22
            ZIndex: =60
      - lblInboxCrumb:
          Control: Label@2.5.1
          Properties:
            Color: =gblTheme.TextMuted
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Normal
            Height: =18
            Size: =10
            Text: ="Role · L1 Safety Advisor"
            Width: =640
            X: =gblNavWidth + 22
            Y: =18
            ZIndex: =50
      - lblInboxTitle:
          Control: Label@2.5.1
          Properties:
            Color: =gblTheme.Text
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =36
            Size: =21
            Text: ="New risks identified"
            Width: =520
            X: =gblNavWidth + 22
            Y: =36
            ZIndex: =50
