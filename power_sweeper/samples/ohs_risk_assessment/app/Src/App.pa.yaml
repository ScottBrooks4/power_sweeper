          Surface: ColorValue("#132736"),
          Paper: ColorValue("#132736"),
          Text: ColorValue("#F6F4EF"),
          TextMuted: ColorValue("#8AA0AB"),
          TextOnAccent: Color.White,
          TextOnLight: ColorValue("#172026"),
          Border: ColorValue("#243847"),
          BorderStrong: ColorValue("#3D5360"),
          Accent: ColorValue("#14958C"),
          Accent2: ColorValue("#0E746C"),
          Chip: ColorValue("#1A3340"),
          ChipOn: ColorValue("#F6F4EF"),
          ChipOnInk: ColorValue("#0B1C28"),
          Quiet: ColorValue("#1A3340"),
          Badge: ColorValue("#C45C26"),
          Rail: ColorValue("#06131C"),
          Rail2: ColorValue("#0B1C28"),
          RailLine: ColorValue("#243847"),
          RailActive: ColorValue("#1A3340"),
          RailText: ColorValue("#C9D6DC"),
          RailMuted: ColorValue("#8AA0AB"),
          RailTitle: ColorValue("#F6F4EF"),
          Avatar: ColorValue("#1E4A4A"),
          AvatarInk: ColorValue("#D7EFE8"),
          Danger: ColorValue("#C8102E"),
          Success: ColorValue("#BFE4CF"),
          Warning: ColorValue("#F3D48A"),
          Focus: ColorValue("#14958C"),
          Selected: ColorValue("#F6F4EF"),
          Disabled: ColorValue("#243847"),
          RiskLow: ColorValue("#BFE4CF"),
          RiskModerate: ColorValue("#F3D48A"),
          RiskHigh: ColorValue("#F0A57A"),
          RiskExtreme: ColorValue("#E07A7A"),
          ScoreLow: ColorValue("#D9EFE3"),
          ScoreModerate: ColorValue("#F8E7C2"),
          ScoreHigh: ColorValue("#F8D3C2"),
          ScoreExtreme: ColorValue("#F4C9C9"),
          RiskLowInk: ColorValue("#1D6B43"),
          RiskModerateInk: ColorValue("#B45309"),
          RiskHighInk: ColorValue("#C2410C"),
          RiskExtremeInk: ColorValue("#9B1C1C")
