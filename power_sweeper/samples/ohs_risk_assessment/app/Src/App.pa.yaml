      gblColorBannerWarnInk = ColorValue("#6B3F12");
      gblColorBannerWarnLine = ColorValue("#EAD3B0");
      gblColorClosed = ColorValue("#E7F3EC");
      gblColorClosedLine = ColorValue("#C5DDCF");
      gblColorRiskLow = gblTheme.RiskLow;
      gblColorRiskModerate = gblTheme.RiskModerate;
      gblColorRiskHigh = gblTheme.RiskHigh;
      gblColorRiskExtreme = gblTheme.RiskExtreme;
      gblColorScoreLow = gblTheme.ScoreLow;
      gblColorScoreModerate = gblTheme.ScoreModerate;
      gblColorScoreHigh = gblTheme.ScoreHigh;
      gblColorScoreExtreme = gblTheme.ScoreExtreme;
      gblColorRiskLowInk = gblTheme.RiskLowInk;
      gblColorRiskModerateInk = gblTheme.RiskModerateInk;
      gblColorRiskHighInk = gblTheme.RiskHighInk;
      gblColorRiskExtremeInk = gblTheme.RiskExtremeInk;

      fxRiskCycleStep = Switch(
          App.ActiveScreen,
          Dashboard, 1,
          Homepage, 1,
          Details, 2,
          Approvals, 3,
          1
      );

      SideMenuFirstTable = [
          {
              ScreenName: "Dashboard",
              Name: "Dashboard",
              Icon: Icon.Items,
              Step: 0
          },
          {
              ScreenName: "Homepage",
              Name: "Inbox",
              Icon: Icon.Message,
              Step: 1
          },
          {
              ScreenName: "Details",
              Name: "Review",
              Icon: Icon.Clock,
              Step: 2
          },
          {
              ScreenName: "Approvals",
              Name: "Treat",
              Icon: Icon.CheckMark,
              Step: 3
          },
          {
              ScreenName: "Chat",
              Name: "Chat",
              Icon: Icon.Compose,
              Step: 0
          }
      ];
      SideMenuSecondTable = [
          {
              ScreenName: "Homepage",
              Name: "Identify",
              Step: 1
          },
          {
              ScreenName: "Details",
              Name: "Review / score",
              Step: 2
          },
          {
              ScreenName: "Approvals",
              Name: "Treat",
              Step: 3
          },
          {
              ScreenName: "Dashboard",
              Name: "Close / archive",
              Step: 4
          }
      ];
      SideMenuThirdTable = [];
    OnStart: |-
      =Set(AppVersion,"0.0.0");
      Set(varSideMenu, true);
      Set(varTopMenu, false);
      Set(varShowLoadingContainer, false);
      Set(varLang, true);
      Set(varL2, "All L2s");
      Set(varProgram, "All");
      Set(varHighOnly, false);
      Set(varHighlightP, 4);
      Set(varHighlightS, 3);
      Set(varInboxCount, 4);
      Set(varUserDisplay, "L1 Safety Advisor");
      Set(varUserRole, "VCDS Group HQ");
      Set(varControlLevel, 5);

      ClearCollect(
          colRiskCounts,
          [
              {Probability: 5, Severity: 1, RiskCount: 0},
              {Probability: 5, Severity: 2, RiskCount: 0},
              {Probability: 5, Severity: 3, RiskCount: 0},
              {Probability: 5, Severity: 4, RiskCount: 0},
              {Probability: 5, Severity: 5, RiskCount: 0},
              {Probability: 4, Severity: 1, RiskCount: 1},
              {Probability: 4, Severity: 2, RiskCount: 5},
              {Probability: 4, Severity: 3, RiskCount: 4},
              {Probability: 4, Severity: 4, RiskCount: 0},
              {Probability: 4, Severity: 5, RiskCount: 0},
              {Probability: 3, Severity: 1, RiskCount: 0},
              {Probability: 3, Severity: 2, RiskCount: 11},
              {Probability: 3, Severity: 3, RiskCount: 3},
              {Probability: 3, Severity: 4, RiskCount: 1},
              {Probability: 3, Severity: 5, RiskCount: 0},
              {Probability: 2, Severity: 1, RiskCount: 0},
              {Probability: 2, Severity: 2, RiskCount: 17},
              {Probability: 2, Severity: 3, RiskCount: 3},
              {Probability: 2, Severity: 4, RiskCount: 1},
              {Probability: 2, Severity: 5, RiskCount: 1},
              {Probability: 1, Severity: 1, RiskCount: 8},
              {Probability: 1, Severity: 2, RiskCount: 1},
              {Probability: 1, Severity: 3, RiskCount: 0},
              {Probability: 1, Severity: 4, RiskCount: 2},
              {Probability: 1, Severity: 5, RiskCount: 1}
          ]
      );

      ClearCollect(
          colRiskCells,
          ForAll(
              Sequence(25) As i,
              With(
                  {
                      p: 6 - RoundUp(i.Value / 5, 0),
                      s: If(Mod(i.Value, 5) = 0, 5, Mod(i.Value, 5))
                  },
                  {
                      Probability: p,
                      Severity: s,
                      Score: p * s,
                      RiskCount: Coalesce(
                          LookUp(colRiskCounts, Probability = p && Severity = s).RiskCount,
                          0
                      )
                  }
              )
          )
      );

      ClearCollect(
          colFilters,
          [
              {Kind: "L2", Value: "All L2s", Selected: true},
              {Kind: "L2", Value: "VCDS Group HQ", Selected: false},
              {Kind: "L2", Value: "CFSG (O-G)", Selected: false},
              {Kind: "L2", Value: "CJCR Gp", Selected: false},
              {Kind: "L2", Value: "CANELEMNORAD", Selected: false},
              {Kind: "Program", Value: "General Safety", Selected: false},
              {Kind: "Program", Value: "WHVP", Selected: false},
              {Kind: "Program", Value: "Hazardous substances", Selected: false},
              {Kind: "Level", Value: "High + Extreme", Selected: false}
          ]
      );

      ClearCollect(
          colInboxFilters,
          [
              {Kind: "Status", Value: "Needs L1 review", Selected: true},
              {Kind: "Level", Value: "High (L2)", Selected: false},
              {Kind: "Program", Value: "WHMIS / HazMat", Selected: false},
              {Kind: "Program", Value: "WHVP", Selected: false},
              {Kind: "Status", Value: "Archive candidates", Selected: false}
          ]
      );

      ClearCollect(
          colHierarchy,
          [
              {Level: 1, Title: "Elimination"},
              {Level: 2, Title: "Substitution"},
              {Level: 3, Title: "Engineering"},
              {Level: 4, Title: "Administrative"},
              {Level: 5, Title: "PPE"}
          ]
      );

      ClearCollect(
          colProbabilityLegend,
          [
              {Level: 5, Title: "Almost Certain"},
              {Level: 4, Title: "Likely"},
              {Level: 3, Title: "Possible"},
              {Level: 2, Title: "Unlikely"},
              {Level: 1, Title: "Rare"}
          ]
      );

      ClearCollect(
          colSeverityLegend,
          [
              {Level: 1, Title: "Negligible"},
              {Level: 2, Title: "Minor"},
              {Level: 3, Title: "Moderate"},
              {Level: 4, Title: "Major"},
              {Level: 5, Title: "Catastrophic"}
          ]
      );

      ClearCollect(
          colRiskCategories,
          [
              {Band: "Low", Title: "Low 1–3", MinScore: 1, MaxScore: 3},
              {Band: "Moderate", Title: "Moderate 4–6", MinScore: 4, MaxScore: 6},
              {Band: "High", Title: "High 8–12", MinScore: 8, MaxScore: 12},
              {Band: "Extreme", Title: "Extreme 15–25", MinScore: 15, MaxScore: 25}
          ]
      );
    StartScreen: =Dashboard
    Theme: =PowerAppsTheme
