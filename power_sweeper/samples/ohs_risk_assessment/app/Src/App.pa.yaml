      gblTheme = gblThemeLight;

      gblNavWidth = 216;
      gblRadius = 8;
      gblRadiusPill = 20;
      DefaultGrayBackgroud = gblTheme.Page;
      gblColorPage = gblTheme.Page;
      gblColorPaper = gblTheme.Paper;
      gblColorInk = gblTheme.Text;
      gblColorMuted = gblTheme.TextMuted;
      gblColorLine = gblTheme.Border;
      gblColorOnAccent = gblTheme.TextOnAccent;
      gblColorNav = gblTheme.Rail;
