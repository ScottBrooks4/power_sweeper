ComponentDefinitions:
  InfoBtn_PopUp:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    Properties:
      Fill: =RGBA(240, 240, 240, 0.4)
      Height: =App.Height
      Width: =App.Width
    Children:
      - Container36:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(227, 229, 230, 1)
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =300
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =700
            X: =Parent.Width/2 - Self.Width/2
            Y: =Parent.Height/2 - Self.Height/2
          Children:
            - Container78:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderStyle: =BorderStyle.None
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Parent.Width
                Children:
                  - HtmlText1:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AutoHeight: =true
                        Font: =Font.'Open Sans'
                        Height: =57
                        HtmlText: ="<pre>" & varInfoTitle & "</pre>"
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =15
                        PaddingRight: =0
                        Width: =Parent.Width
                  - Container6_7:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                        Y: =Container55_5.Y + Container55_5.Height
                      Children:
                        - Container7_9:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(230, 230, 230, 1)
                              Height: =0.5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                              Y: =(Parent.Height / 2) - (Self.Height / 2)
                  - Text4:
                      Control: ModernText@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =15
                        Size: =12
                        Text: =varInfoValue
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width
            - Icon4:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(51, 51, 51, 1)
                  Height: =30
                  Icon: =Icon.Cancel
                  OnSelect: =Set(varInfoContainer,false);
                  PaddingRight: =10
                  PaddingTop: =10
                  Width: =30
                  X: =670
