Screen1:
  Control: Screen@2.0.0
  Properties:
    Fill: =RGBA(255, 255, 255, 1)
    OnVisible: =Set(varReady, true)
  Children:
    - TitleLabel:
        Control: Label@2.0.0
        Properties:
          Text: ="Roundtrip Demo"
          X: =20
          Y: =20
          Width: =300
          Height: =40
          Color: =RGBA(17, 24, 39, 1)
          FontSize: =24
    - GoNext:
        Control: Classic/Button@2.0.0
        Properties:
          Text: ="Next"
          X: =20
          Y: =80
          Width: =120
          Height: =40
          Fill: =RGBA(37, 99, 235, 1)
          Color: =RGBA(255, 255, 255, 1)
          OnSelect: =Set(varFlag, true); Navigate(Screen2)
    - FlagLabel:
        Control: Label@2.0.0
        Properties:
          Text: =If(varFlag, "Flag on", "Flag off")
          X: =160
          Y: =80
          Width: =160
          Height: =40
          Visible: =true
    - ItemsGallery:
        Control: Gallery@2.0.0
        Properties:
          Items: ='Items'
          X: =20
          Y: =140
          Width: =360
          Height: =200
          Fill: =RGBA(243, 244, 246, 1)
    - NameInput:
        Control: Classic/TextInput@2.0.0
        Properties:
          Default: ="Sample"
          X: =20
          Y: =360
          Width: =240
          Height: =40
    - SaveRow:
        Control: Classic/Button@2.0.0
        Properties:
          Text: ="Save"
          X: =280
          Y: =360
          Width: =100
          Height: =40
          OnSelect: |-
            =Patch('Items', Defaults('Items'), {Title: NameInput.Text, Value: "C"})
