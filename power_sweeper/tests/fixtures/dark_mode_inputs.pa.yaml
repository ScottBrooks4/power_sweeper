App:
  Control: App@1.0.0
  Properties:
    OnStart: =Set(gblReady, true)
Screen1:
  Control: Screen@2.0.0
  Properties:
    Fill: =RGBA(248, 250, 252, 1)
  Children:
    - TitleInput:
        Control: Classic/TextInput@2.3.2
        Properties:
          Default: ="Brooks Scott"
          Fill: =RGBA(255, 255, 255, 1)
          Color: =RGBA(15, 23, 42, 1)
          BorderColor: =RGBA(148, 163, 184, 1)
          X: =20
          Y: =20
          Width: =300
          Height: =40
    - GreyFillInput:
        Control: Classic/TextInput@2.3.2
        Properties:
          Default: ="21-30 years"
          Fill: =RGBA(210, 210, 210, 1)
          Color: =RGBA(211, 211, 211, 1)
          BorderColor: =RGBA(200, 200, 200, 1)
          X: =20
          Y: =70
          Width: =300
          Height: =40
    - DarkFillInput:
        Control: Classic/TextInput@2.3.2
        Properties:
          Default: ="Position title"
          Fill: =RGBA(18, 18, 18, 1)
          Color: =RGBA(20, 20, 20, 1)
          BorderColor: =RGBA(51, 51, 51, 1)
          X: =20
          Y: =120
          Width: =300
          Height: =40
    - RankDropdown:
        Control: Classic/DropDown@2.3.1
        Properties:
          Items: =["Cdr", "Capt"]
          Fill: =RGBA(245, 245, 245, 1)
          Color: =RGBA(220, 220, 220, 1)
          BorderColor: =RGBA(226, 232, 240, 1)
          X: =20
          Y: =170
          Width: =300
          Height: =40
    - LanguageCombo:
        Control: Classic/ComboBox@2.4.0
        Properties:
          Items: =["EN", "FR"]
          Fill: =Color.LightGray
          Color: =Color.LightGray
          X: =20
          Y: =220
          Width: =300
          Height: =40
    - OutlineModernInput:
        Control: ModernTextInput@1.1.1
        Properties:
          Default: ="Scott"
          Appearance: =Appearance.Outline
          Fill: =RGBA(255, 255, 255, 1)
          Color: =RGBA(15, 23, 42, 1)
          X: =20
          Y: =270
          Width: =240
          Height: =40
    - FilledDarkerModernInput:
        Control: ModernTextInput@1.1.1
        Properties:
          Default: ="Brooks"
          Appearance: =Appearance.FilledDarker
          Fill: =RGBA(255, 255, 255, 1)
          Color: =RGBA(255, 255, 255, 1)
          X: =20
          Y: =320
          Width: =240
          Height: =40
    - LightGrayCaption:
        Control: Label@2.5.1
        Properties:
          Text: ="Tell us about yourself"
          Color: =RGBA(211, 211, 211, 1)
          X: =20
          Y: =370
          Width: =300
          Height: =24
    - MidGrayCaption:
        Control: Label@2.5.1
        Properties:
          Text: ="Signed in as"
          Color: =RGBA(180, 180, 180, 1)
          X: =20
          Y: =400
          Width: =300
          Height: =24
    - RankModernCombo:
        Control: ModernCombobox@1.1.1
        Properties:
          Items: =["Cdr", "Capt"]
          Fill: =If(gblDarkMode, gblTheme.InputFill, RGBA(255, 255, 255, 1))
          Color: =gblTheme.Text
          BasePaletteColor: =gblTheme.SurfaceAlt
          X: =20
          Y: =430
          Width: =300
          Height: =40
    - LanguageModernCombo:
        Control: ModernCombobox@1.1.1
        Properties:
          Items: =["EN", "FR"]
          Fill: =RGBA(255, 255, 255, 1)
          Color: =RGBA(211, 211, 211, 1)
          X: =20
          Y: =480
          Width: =300
          Height: =40
    - YearsModernDropdown:
        Control: ModernDropdown@1.0.2
        Properties:
          Items: =["21-30 years"]
          Fill: =RGBA(245, 245, 245, 1)
          Color: =Color.LightGray
          X: =20
          Y: =530
          Width: =300
          Height: =40
